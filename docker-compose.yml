version: '3.8'

services:
  postgresql:
    image: postgres:16-alpine
    container_name: site-profissional-db
    environment:
      POSTGRES_DB: site_pessoas_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: Senha@Segura123
      POSTGRES_INITDB_ARGS: "-c timezone=America/Sao_Paulo"
    ports:
      - "5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d site_pessoas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_volume:
    driver: local

networks:
  app-network:
    driver: bridge
