# ========== SPRING BOOT ==========
spring.application.name=site-profissional
server.port=8080

# ========== POSTGRESQL DATABASE ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/site_pessoas_db
spring.datasource.username=admin_user
spring.datasource.password=Senha@Segura123
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========== THYMELEAF ==========
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ========== SECURITY ==========
spring.security.user.name=admin
spring.security.user.password=Admin@12345

# ========== LOGGING ==========
logging.level.root=INFO
logging.level.com.exemplo.site=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ========== MERCADO PAGO ==========
mercadopago.access_token=${MERCADO_PAGO_ACCESS_TOKEN:TEST_ACCESS_TOKEN}
mercadopago.public_key=${MERCADO_PAGO_PUBLIC_KEY:TEST_PUBLIC_KEY}
mercadopago.api.url=https://api.mercadopago.com
mercadopago.webhook.url=${WEBHOOK_URL:http://localhost:8080/webhook/mercado-pago}
